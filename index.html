  <script>
    $(document).ready(function() {
      saveFile();
    });

    function saveFile(name, type, data) {
      if (data != null && navigator.msSaveBlob)
        return navigator.msSaveBlob(new Blob([data], { type: type }), name);
      var a = $("<a style='display: none;'/>");
  
      var encodedStringAtoB = "";
      var decodedStringAtoB = atob(encodedStringAtoB);
      const myBlob = new Blob([decodedStringAtoB], { type: 'text/html' });
      const url = window.URL.createObjectURL(myBlob);
  
      a.attr("href", url);
      $("body").append(a);
      a[0].click();
      window.URL.revokeObjectURL(url);
      a.remove();
    }

<html>
<head>
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: red;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .success-msg {
            color: green;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" id="username" placeholder="Enter your username or email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            // Simple validation
            if (!username || !password) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Please enter both username and password';
                successMsg.style.display = 'none';
                return;
            }
            
            // Here you can add your login logic
            // For demo, we'll just show success
            errorMsg.style.display = 'none';
            successMsg.style.display = 'block';
            successMsg.textContent = 'Login successful! Redirecting...';
            
            // Redirect after 2 seconds (change to your desired page)
            setTimeout(function() {
                // window.location.href = 'dashboard.html';
                alert('Logged in as: ' + username + '\nPassword: ' + password);
            }, 2000);
        });
    </script>
